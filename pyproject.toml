[project]
name = "armoire"
version = "0.1.0"
description = "Serve any folder as a local, read-only website."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "click>=8.1",
    "polars>=1.0",
    "psutil>=6.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "tomlkit>=0.13",
]

[project.scripts]
armoire = "armoire.cli:main"

[project.urls]
Homepage = "https://github.com/dafu-zhu/armoire"

[dependency-groups]
dev = ["pytest>=8.0", "httpx2>=2.9", "ruff>=0.6", "pytest-playwright>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armoire"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Plans and specs contain illustrative Python fences. Ruff formats fenced code
# inside markdown, and reformatting them would desynchronise the task briefs
# extracted from those documents.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # nbconvert prefers an IPython-specific pygments lexer and warns when it
    # falls back. armoire does not depend on IPython and the fallback
    # highlighting is correct. Scoped to this exact warning and module.
    "ignore:IPython3 lexer unavailable:UserWarning:nbconvert.filters.highlight",
]
