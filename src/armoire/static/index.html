<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>armoire</title>
<link rel="stylesheet" href="/vendor/katex.css">
<link rel="stylesheet" href="/vendor/highlight.css">
<link rel="stylesheet" href="/vendor/pygments.css">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/marked.js"></script>
<script src="/vendor/katex.js"></script>
<script src="/vendor/katex-auto-render.js"></script>
<script src="/vendor/mermaid.js"></script>
<script src="/vendor/highlight.js"></script>
<script src="/vendor/hljs-latex.js"></script>
<script src="/vendor/hljs-julia.js"></script>
<script src="/vendor/hljs-matlab.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/vendor/dagre.js"></script>

<header id="header">
  <span id="root-name">armoire</span>
  <div id="filter-wrap">
    <input id="filter" type="search" placeholder="Filter files…" autocomplete="off" spellcheck="false">
    <ul id="filter-results" hidden></ul>
  </div>
</header>

<div id="body">
  <nav id="tree" aria-label="Folder tree"></nav>
  <main id="main">
    <div id="breadcrumb"></div>
    <div id="content"></div>
  </main>
  <section id="roadmap" hidden aria-label="Project roadmap">
    <svg id="roadmap-canvas"></svg>
    <div id="roadmap-message"></div>
    <div id="roadmap-controls">
      <button id="zoom-out" type="button">&minus;</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" type="button">+</button>
      <button id="layout-reset" type="button">Reset layout</button>
    </div>
  </section>
  <aside id="categories" hidden aria-label="Projects outside the roadmap"></aside>
</div>

<footer id="status"></footer>

<script type="module" src="/app.js"></script>
